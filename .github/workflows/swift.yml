name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ui-tests:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: List schemes
        run: |
          xcodebuild -project PackageRunner/PackageRunner.xcodeproj -list

      - name: Allow Swift macros in CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Install Metal toolchain
        run: |
          set -euo pipefail

          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showComponent metalToolchain
          xcrun -f metal
          xcrun metal --version

      - name: Run PackageRunner UI tests with coverage
        run: |
          set -euo pipefail

          xcodebuild \
            -project PackageRunner/PackageRunner.xcodeproj \
            -scheme PackageRunner \
            -destination 'platform=macOS' \
            -derivedDataPath Build/DerivedData \
            -resultBundlePath Build/PackageRunnerUITests.xcresult \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            -only-testing:PackageRunnerUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Show xcresult coverage summary
        run: |
          xcrun xccov view --report Build/PackageRunnerUITests.xcresult || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          xcode: true
          xcode_archive_path: Build/PackageRunnerUITests.xcresult
          fail_ci_if_error: true
          verbose: true
